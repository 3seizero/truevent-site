<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TRUE - Manutenzione in corso</title>
  <style>
    :root{
      --black:#09080C; --dark:#101018; --mid:#18171E;
      --white:#F5F0E8; --gold:#C8A96E; --gold-light:#DFC898; --gray:#78706A;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:radial-gradient(120% 120% at 50% 0%, var(--mid) 0%, var(--black) 60%);
      color:var(--white);
      font-family:"Roboto","Helvetica Neue",Arial,sans-serif;
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:32px;text-align:center;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:560px}
    .logo{width:180px;max-width:60vw;height:auto;margin:0 auto 40px;display:block;opacity:.95}
    .badge{
      display:inline-block;font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.18em;
      text-transform:uppercase;color:var(--gold);border:1px solid rgba(200,169,110,.4);
      border-radius:999px;padding:6px 16px;margin-bottom:28px;
    }
    h1{font-size:28px;font-weight:700;line-height:1.25;margin-bottom:18px}
    p{font-size:16px;line-height:1.6;color:var(--gray);font-weight:400}
    .msg{margin-top:18px;color:var(--gold-light);font-size:15px}
    .rule{width:48px;height:2px;background:var(--gold);margin:36px auto 0;border-radius:2px}
    .foot{margin-top:24px;font-family:"Roboto Mono",monospace;font-size:12px;color:var(--gray);letter-spacing:.08em}
  </style>
</head>
<body>
  <main class="wrap">
    <svg class="logo" viewBox="0 0 384 79" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TRUE">
      <g fill="#F5F0E8">
        <polygon points="0 14.6 0 .2 61.8 .2 61.8 14.6 39.6 14.6 39.6 78 22.3 78 22.3 14.6 0 14.6"/>
        <path d="M178.4,75.6v2.3h-19.1l-17.2-25.7h-14.9v25.7h-17.9V0C121.3,0,133.1,0,145,0c19.1,0,29.5,12.9,29.5,26.7s-5.4,18.6-14.9,22.9l18.8,25.9ZM144.9,38.5c7.5,0,12.4-5.5,12.3-12.1,0-6.6-4.6-11.8-12.3-11.8h-17.9v23.9h17.9Z"/>
        <path d="M216.9,52.1V.2h17.9v51.6c0,8.3,7.3,12.6,15.5,12.6s15.4-4.2,15.4-12.6V.2h17.6v51.9c0,17.5-15.4,26.9-33,26.9s-33.4-9.5-33.4-26.9"/>
        <polygon points="383 14.7 349.9 14.7 349.9 30.5 380.9 30.5 380.9 45.1 349.9 45.1 349.9 62.9 384 62.9 384 78 331.9 78 331.9 .2 383 .2 383 14.7"/>
      </g>
    </svg>
    <span class="badge">Manutenzione in corso</span>
    <h1>Stiamo aggiornando il sito</h1>
    <p>Stiamo lavorando per migliorare l'esperienza. Torneremo online a breve.</p>
    <div class="rule"></div>
    <div class="foot">TRUE - truevent.eu</div>
  </main>
</body>
</html>
